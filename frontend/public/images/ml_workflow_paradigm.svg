<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #94a3b8; }
      .pill-text { font-family: "SF Mono", Consolas, monospace; font-size: 12px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="12" fill="url(#mlBg)" />
  <rect x="1.5" y="1.5" width="997" height="477" rx="11" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Header -->
  <text x="500" y="44" text-anchor="middle" class="title" font-size="20">Computing Paradigms: Traditional Programming vs Machine Learning</text>
  <text x="500" y="66" text-anchor="middle" class="subtitle">مقارنة منهجية: البرمجة التقليدية مقابل تعلم الآلة واستنتاج القواعد ذاتياً</text>

  <!-- PARADIGM 1: TRADITIONAL PROGRAMMING -->
  <g transform="translate(60, 100)">
    <rect width="880" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="880" height="30" rx="8" fill="#0f172a" />
    <text x="20" y="20" class="box-title">Traditional Programming / البرمجة التقليدية</text>

    <!-- Inputs -->
    <g transform="translate(30, 48)">
      <rect width="160" height="32" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="80" y="20" class="pill-text" fill="#93c5fd">Input Data (بيانات)</text>

      <rect y="42" width="160" height="32" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="80" y="62" class="pill-text" fill="#93c5fd">Explicit Rules (قواعد)</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(210, 80)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#64748b" stroke-width="2" />
      <polygon points="60,-5 70,0 60,5" fill="#64748b" />
    </g>

    <!-- Processing Box -->
    <g transform="translate(300, 52)">
      <rect width="260" height="64" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" />
      <text x="130" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13" fill="#ffffff">Classical Program Execution</text>
      <text x="130" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">الحاسوب يطبق القواعد المكتوبة مسبقاً</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(580, 80)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#64748b" stroke-width="2" />
      <polygon points="60,-5 70,0 60,5" fill="#64748b" />
    </g>

    <!-- Output -->
    <g transform="translate(660, 58)">
      <rect width="180" height="52" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" fill="#f1f5f9">Computed Answers</text>
      <text x="90" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">المخرجات والنتائج</text>
    </g>
  </g>

  <!-- PARADIGM 2: MACHINE LEARNING -->
  <g transform="translate(60, 260)">
    <rect width="880" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="880" height="30" rx="8" fill="#0f172a" />
    <text x="20" y="20" class="box-title" fill="#a7f3d0">Machine Learning Paradigm / نموذج تعلم الآلة</text>

    <!-- Inputs -->
    <g transform="translate(30, 48)">
      <rect width="160" height="32" rx="4" fill="#0f172a" stroke="#059669" stroke-width="1" />
      <text x="80" y="20" class="pill-text" fill="#a7f3d0">Input Data (بيانات)</text>

      <rect y="42" width="160" height="32" rx="4" fill="#0f172a" stroke="#059669" stroke-width="1" />
      <text x="80" y="62" class="pill-text" fill="#a7f3d0">Answers (أمثلة الحل)</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(210, 80)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#059669" stroke-width="2" />
      <polygon points="60,-5 70,0 60,5" fill="#059669" />
    </g>

    <!-- Processing Box -->
    <g transform="translate(300, 52)">
      <rect width="260" height="64" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
      <text x="130" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13" fill="#ffffff">Model Training Algorithm</text>
      <text x="130" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#a7f3d0">النموذج يكتشف الأنماط والعلاقات ذاتياً</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(580, 80)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#059669" stroke-width="2" />
      <polygon points="60,-5 70,0 60,5" fill="#059669" />
    </g>

    <!-- Output -->
    <g transform="translate(660, 58)">
      <rect width="180" height="52" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
      <text x="90" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" fill="#ffffff">Learned Rules (Model)</text>
      <text x="90" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#a7f3d0">القواعد والنموذج المدرب</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(150, 422)">
    <rect width="700" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="350" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      <tspan font-weight="600" fill="#93c5fd">Core Difference:</tspan> Instead of hard-coding every rule, Machine Learning induces statistical generalizations directly from datasets.
    </text>
  </g>
</svg>
