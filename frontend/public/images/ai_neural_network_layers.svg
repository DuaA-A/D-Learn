<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <style>
      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 13px; fill: #f1f5f9; text-anchor: middle; }
      .layer-sub { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #93c5fd; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" rx="12" fill="url(#nnBg)" />
  <rect x="1.5" y="1.5" width="997" height="477" rx="11" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Header -->
  <text x="500" y="44" text-anchor="middle" class="t-title" font-size="20">Neural Network Architecture: Deep Learning Mechanism</text>
  <text x="500" y="66" text-anchor="middle" class="t-sub">بنية الشبكة العصبية الاصطناعية: طبقات الإدخال، الطبقات المخفية، تعديل الأوزان، والمخرجات</text>

  <!-- SYNAPSES -->
  <g stroke="url(#synapseGrad)" stroke-width="1" stroke-opacity="0.3">
    <!-- Input to Hidden 1 -->
    <line x1="160" y1="160" x2="380" y2="130" /><line x1="160" y1="160" x2="380" y2="200" /><line x1="160" y1="160" x2="380" y2="270" /><line x1="160" y1="160" x2="380" y2="340" />
    <line x1="160" y1="250" x2="380" y2="130" /><line x1="160" y1="250" x2="380" y2="200" /><line x1="160" y1="250" x2="380" y2="270" /><line x1="160" y1="250" x2="380" y2="340" />
    <line x1="160" y1="340" x2="380" y2="130" /><line x1="160" y1="340" x2="380" y2="200" /><line x1="160" y1="340" x2="380" y2="270" /><line x1="160" y1="340" x2="380" y2="340" />

    <!-- Hidden 1 to Hidden 2 -->
    <line x1="380" y1="130" x2="600" y2="130" /><line x1="380" y1="130" x2="600" y2="200" /><line x1="380" y1="130" x2="600" y2="270" /><line x1="380" y1="130" x2="600" y2="340" />
    <line x1="380" y1="200" x2="600" y2="130" /><line x1="380" y1="200" x2="600" y2="200" /><line x1="380" y1="200" x2="600" y2="270" /><line x1="380" y1="200" x2="600" y2="340" />
    <line x1="380" y1="270" x2="600" y2="130" /><line x1="380" y1="270" x2="600" y2="200" /><line x1="380" y1="270" x2="600" y2="270" /><line x1="380" y1="270" x2="600" y2="340" />
    <line x1="380" y1="340" x2="600" y2="130" /><line x1="380" y1="340" x2="600" y2="200" /><line x1="380" y1="340" x2="600" y2="270" /><line x1="380" y1="340" x2="600" y2="340" />

    <!-- Hidden 2 to Output -->
    <line x1="600" y1="130" x2="820" y2="190" /><line x1="600" y1="130" x2="820" y2="310" />
    <line x1="600" y1="200" x2="820" y2="190" /><line x1="600" y1="200" x2="820" y2="310" />
    <line x1="600" y1="270" x2="820" y2="190" /><line x1="600" y1="270" x2="820" y2="310" />
    <line x1="600" y1="340" x2="820" y2="190" /><line x1="600" y1="340" x2="820" y2="310" />
  </g>

  <!-- LAYER 1: INPUT LAYER -->
  <g>
    <text x="160" y="105" class="layer-title">Input Layer</text>
    <text x="160" y="122" class="layer-sub">طبقة الإدخال (المعطيات الخام)</text>

    <circle cx="160" cy="160" r="20" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="160" y="164" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">x₁</text>

    <circle cx="160" cy="250" r="20" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="160" y="254" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">x₂</text>

    <circle cx="160" cy="340" r="20" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="160" y="344" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">x₃</text>
  </g>

  <!-- LAYER 2 & 3: HIDDEN LAYERS -->
  <g>
    <text x="490" y="90" class="layer-title">Hidden Layers (Deep Feature Extraction)</text>
    <text x="490" y="107" class="layer-sub">الطبقات المخفية: استخراج الميزات وتعديل الأوزان (Synaptic Weights)</text>

    <!-- Column 1 -->
    <circle cx="380" cy="130" r="16" fill="#4338ca" stroke="#818cf8" stroke-width="2" />
    <circle cx="380" cy="200" r="16" fill="#4338ca" stroke="#818cf8" stroke-width="2" />
    <circle cx="380" cy="270" r="16" fill="#4338ca" stroke="#818cf8" stroke-width="2" />
    <circle cx="380" cy="340" r="16" fill="#4338ca" stroke="#818cf8" stroke-width="2" />

    <!-- Column 2 -->
    <circle cx="600" cy="130" r="16" fill="#6d28d9" stroke="#a78bfa" stroke-width="2" />
    <circle cx="600" cy="200" r="16" fill="#6d28d9" stroke="#a78bfa" stroke-width="2" />
    <circle cx="600" cy="270" r="16" fill="#6d28d9" stroke="#a78bfa" stroke-width="2" />
    <circle cx="600" cy="340" r="16" fill="#6d28d9" stroke="#a78bfa" stroke-width="2" />

    <!-- Weight Formula Tag -->
    <rect x="440" y="225" width="100" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="490" y="241" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">Σ(wᵢ · xᵢ) + b</text>
  </g>

  <!-- LAYER 4: OUTPUT LAYER -->
  <g>
    <text x="820" y="105" class="layer-title">Output Layer</text>
    <text x="820" y="122" class="layer-sub">طبقة الإخراج (الاحتمالات والتصنيف)</text>

    <!-- Out 1 -->
    <circle cx="820" cy="190" r="22" fill="#047857" stroke="#34d399" stroke-width="2" />
    <text x="820" y="188" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="600">Class 1</text>
    <text x="820" y="202" text-anchor="middle" font-size="9" fill="#a7f3d0">p = 0.94</text>

    <!-- Out 2 -->
    <circle cx="820" cy="310" r="22" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="820" y="308" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-weight="600">Class 2</text>
    <text x="820" y="322" text-anchor="middle" font-size="9" fill="#64748b">p = 0.06</text>
  </g>

  <!-- Bottom Explanatory Box -->
  <g transform="translate(100, 420)">
    <rect width="800" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="400" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#e2e8f0">
      <tspan font-weight="600" fill="#93c5fd">Training Process:</tspan> Weights are optimized iteratively through backpropagation and gradient descent to minimize output loss.
    </text>
    <text x="400" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8">
      آلية التدريب: ضبط أوزان الروابط العصبية عبر التغذية العكسية لتقليل نسبة الخطأ وتحقيق أعلى دقة تنبؤ
    </text>
  </g>
</svg>
