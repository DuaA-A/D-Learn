<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glowNode" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .t-title { font-family: system-ui, sans-serif; font-weight: 800; fill: #ffffff; }
      .t-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .layer-title { font-family: system-ui, sans-serif; font-weight: bold; font-size: 13px; fill: #f1f5f9; text-anchor: middle; }
      .layer-sub { font-family: system-ui, sans-serif; font-size: 11px; fill: #93c5fd; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" rx="20" fill="url(#nnBg)" />
  <rect x="2" y="2" width="996" height="496" rx="18" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Header -->
  <text x="500" y="42" text-anchor="middle" class="t-title" font-size="22">🧠 How Deep Learning Works: Neural Network Architecture</text>
  <text x="500" y="65" text-anchor="middle" class="t-sub">بنية الشبكة العصبية الاصطناعية: طبقات الإدخال، الطبقات المخفية، تعديل الأوزان، والمخرجات</text>

  <!-- SYNAPSES (Lines connecting layers) -->
  <!-- Input (x=160) to Hidden 1 (x=380) -->
  <g stroke="url(#synapseGrad)" stroke-width="1.2" stroke-opacity="0.35">
    <!-- From In1 (160, 160) -->
    <line x1="160" y1="160" x2="380" y2="130" /><line x1="160" y1="160" x2="380" y2="200" /><line x1="160" y1="160" x2="380" y2="270" /><line x1="160" y1="160" x2="380" y2="340" />
    <!-- From In2 (160, 250) -->
    <line x1="160" y1="250" x2="380" y2="130" /><line x1="160" y1="250" x2="380" y2="200" /><line x1="160" y1="250" x2="380" y2="270" /><line x1="160" y1="250" x2="380" y2="340" />
    <!-- From In3 (160, 340) -->
    <line x1="160" y1="340" x2="380" y2="130" /><line x1="160" y1="340" x2="380" y2="200" /><line x1="160" y1="340" x2="380" y2="270" /><line x1="160" y1="340" x2="380" y2="340" />

    <!-- Hidden 1 (x=380) to Hidden 2 (x=600) -->
    <line x1="380" y1="130" x2="600" y2="130" /><line x1="380" y1="130" x2="600" y2="200" /><line x1="380" y1="130" x2="600" y2="270" /><line x1="380" y1="130" x2="600" y2="340" />
    <line x1="380" y1="200" x2="600" y2="130" /><line x1="380" y1="200" x2="600" y2="200" /><line x1="380" y1="200" x2="600" y2="270" /><line x1="380" y1="200" x2="600" y2="340" />
    <line x1="380" y1="270" x2="600" y2="130" /><line x1="380" y1="270" x2="600" y2="200" /><line x1="380" y1="270" x2="600" y2="270" /><line x1="380" y1="270" x2="600" y2="340" />
    <line x1="380" y1="340" x2="600" y2="130" /><line x1="380" y1="340" x2="600" y2="200" /><line x1="380" y1="340" x2="600" y2="270" /><line x1="380" y1="340" x2="600" y2="340" />

    <!-- Hidden 2 (x=600) to Output (x=820) -->
    <line x1="600" y1="130" x2="820" y2="190" /><line x1="600" y1="130" x2="820" y2="310" />
    <line x1="600" y1="200" x2="820" y2="190" /><line x1="600" y1="200" x2="820" y2="310" />
    <line x1="600" y1="270" x2="820" y2="190" /><line x1="600" y1="270" x2="820" y2="310" />
    <line x1="600" y1="340" x2="820" y2="190" /><line x1="600" y1="340" x2="820" y2="310" />
  </g>

  <!-- LAYER 1: INPUT LAYER -->
  <g>
    <text x="160" y="105" class="layer-title">Input Layer</text>
    <text x="160" y="122" class="layer-sub">طبقة الإدخال (بيانات خام)</text>

    <!-- Node 1 -->
    <circle cx="160" cy="160" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="3" filter="url(#glowNode)" />
    <text x="160" y="164" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">Pixel 1</text>

    <!-- Node 2 -->
    <circle cx="160" cy="250" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="3" filter="url(#glowNode)" />
    <text x="160" y="254" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">Pixel 2</text>

    <!-- Node 3 -->
    <circle cx="160" cy="340" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="3" filter="url(#glowNode)" />
    <text x="160" y="344" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">Pixel 3</text>
  </g>

  <!-- LAYER 2 & 3: HIDDEN LAYERS -->
  <g>
    <text x="490" y="90" class="layer-title">Hidden Layers (Deep Representation)</text>
    <text x="490" y="107" class="layer-sub">الطبقات المخفية: استخراج الميزات وتعديل الأوزان (Weights)</text>

    <!-- Column 1 (x=380) -->
    <circle cx="380" cy="130" r="18" fill="#4f46e5" stroke="#818cf8" stroke-width="2.5" />
    <circle cx="380" cy="200" r="18" fill="#4f46e5" stroke="#818cf8" stroke-width="2.5" />
    <circle cx="380" cy="270" r="18" fill="#4f46e5" stroke="#818cf8" stroke-width="2.5" />
    <circle cx="380" cy="340" r="18" fill="#4f46e5" stroke="#818cf8" stroke-width="2.5" />

    <!-- Column 2 (x=600) -->
    <circle cx="600" cy="130" r="18" fill="#7c3aed" stroke="#a78bfa" stroke-width="2.5" />
    <circle cx="600" cy="200" r="18" fill="#7c3aed" stroke="#a78bfa" stroke-width="2.5" />
    <circle cx="600" cy="270" r="18" fill="#7c3aed" stroke="#a78bfa" stroke-width="2.5" />
    <circle cx="600" cy="340" r="18" fill="#7c3aed" stroke="#a78bfa" stroke-width="2.5" />

    <!-- Floating weight label -->
    <rect x="440" y="225" width="100" height="26" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text x="490" y="242" text-anchor="middle" font-family="monospace" font-size="10" fill="#a5b4fc">w1 × x + b</text>
  </g>

  <!-- LAYER 4: OUTPUT LAYER -->
  <g>
    <text x="820" y="105" class="layer-title">Output Layer</text>
    <text x="820" y="122" class="layer-sub">طبقة الإخراج (النتيجة / التوليد)</text>

    <!-- Out 1 -->
    <circle cx="820" cy="190" r="24" fill="#059669" stroke="#34d399" stroke-width="3" filter="url(#glowNode)" />
    <text x="820" y="188" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Class A</text>
    <text x="820" y="202" text-anchor="middle" font-size="9" fill="#a7f3d0">94.8% Cat</text>

    <!-- Out 2 -->
    <circle cx="820" cy="310" r="24" fill="#9f1239" stroke="#fb7185" stroke-width="3" />
    <text x="820" y="308" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Class B</text>
    <text x="820" y="322" text-anchor="middle" font-size="9" fill="#fecdd3">5.2% Dog</text>
  </g>

  <!-- Bottom Explanatory Box -->
  <g transform="translate(100, 420)">
    <rect width="800" height="55" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
    <text x="400" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">
      ⚡ <tspan font-weight="bold">Training Mechanism:</tspan> The model optimizes millions of weights via backpropagation using labeled data.
    </text>
    <text x="400" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">
      آلية التدريب: ضبط أوزان الروابط العصبية عبر مئات آلاف الأمثلة لتصبح قادرة على التعرف والتنبؤ بدقة فائقة
    </text>
  </g>
</svg>
