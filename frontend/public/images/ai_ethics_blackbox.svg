<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ethBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <style>
      .eth-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
      .eth-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .b-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 13.5px; fill: #ffffff; }
      .b-sub { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" rx="12" fill="url(#ethBg)" />
  <rect x="1.5" y="1.5" width="997" height="477" rx="11" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Header -->
  <text x="500" y="44" text-anchor="middle" class="eth-title" font-size="20">AI Governance: Algorithmic Bias and Explainability</text>
  <text x="500" y="66" text-anchor="middle" class="eth-sub">أخلاقيات الذكاء الاصطناعي: التحيز الخوارزمي، مشكلة الصندوق الأسود، وضرورة الشفافية</text>

  <!-- Left: Biased Training Data Input -->
  <g transform="translate(60, 115)">
    <rect width="240" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="240" height="34" rx="8" fill="#0f172a" />
    <text x="120" y="22" text-anchor="middle" class="b-text" fill="#fca5a5">1. Biased Training Data</text>
    <text x="120" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">بيانات تدريب محملة بتحيزات تاريخية</text>
    <line x1="16" y1="64" x2="224" y2="64" stroke="#334155" stroke-width="1" />

    <!-- Details -->
    <g transform="translate(18, 80)">
      <circle cx="4" cy="5" r="3" fill="#f87171" />
      <text x="14" y="9" class="b-sub">• Historical employment disparities</text>
      <text x="14" y="24" class="b-sub">  (e.g., gender imbalance in tech)</text>

      <circle cx="4" cy="46" r="3" fill="#f87171" />
      <text x="14" y="50" class="b-sub">• Demographic data underrepresentation</text>
      <text x="14" y="65" class="b-sub">  (facial recognition accuracy gaps)</text>

      <circle cx="4" cy="88" r="3" fill="#f87171" />
      <text x="14" y="92" class="b-sub">• Garbage in, garbage out principle</text>
      <text x="14" y="107" class="b-sub">  المخرجات تعكس وتضخم عيوب البيانات</text>
    </g>
  </g>

  <!-- Arrow Left to Center -->
  <g transform="translate(315, 235)">
    <line x1="0" y1="15" x2="60" y2="15" stroke="#f87171" stroke-width="2" stroke-dasharray="3" />
    <polygon points="60,10 70,15 60,20" fill="#f87171" />
  </g>

  <!-- Center: The Black Box -->
  <g transform="translate(390, 100)">
    <rect width="220" height="290" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="110" cy="45" r="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <!-- Clean Vector Lock Icon -->
    <rect x="104" y="44" width="12" height="9" rx="1.5" fill="#c7d2fe" />
    <path d="M 106 44 L 106 40 A 4 4 0 0 1 114 40 L 114 44" fill="none" stroke="#c7d2fe" stroke-width="1.5" />

    <text x="110" y="92" text-anchor="middle" class="b-text" fill="#e0e7ff">The "Black Box"</text>
    <text x="110" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#818cf8">مشكلة انعدام الشفافية الداخلية</text>
    <line x1="16" y1="122" x2="204" y2="122" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="146" class="b-sub">• Millions of distributed weights</text>
    <text x="16" y="166" class="b-sub">• Opaque internal reasoning path</text>
    <text x="16" y="186" class="b-sub">• Accountability challenges in</text>
    <text x="16" y="202" class="b-sub">  healthcare, credit, &amp; justice</text>
    <rect x="20" y="222" width="180" height="26" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="110" y="239" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#a5b4fc" font-weight="600">Requires Explainable AI (XAI)</text>
  </g>

  <!-- Arrow Center to Right -->
  <g transform="translate(625, 235)">
    <line x1="0" y1="15" x2="60" y2="15" stroke="#f87171" stroke-width="2" stroke-dasharray="3" />
    <polygon points="60,10 70,15 60,20" fill="#f87171" />
  </g>

  <!-- Right: Unfair Output & Harm -->
  <g transform="translate(700, 115)">
    <rect width="240" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="240" height="34" rx="8" fill="#0f172a" />
    <text x="120" y="22" text-anchor="middle" class="b-text" fill="#fca5a5">3. Disparate Impact</text>
    <text x="120" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">النتائج والقرارات غير العادلة</text>
    <line x1="16" y1="64" x2="224" y2="64" stroke="#334155" stroke-width="1" />

    <!-- Details -->
    <g transform="translate(18, 80)">
      <circle cx="4" cy="5" r="3" fill="#f87171" />
      <text x="14" y="9" class="b-sub">• Automated resume screening bias</text>

      <circle cx="4" cy="30" r="3" fill="#f87171" />
      <text x="14" y="34" class="b-sub">• Disproportionate loan denials</text>

      <circle cx="4" cy="55" r="3" fill="#f87171" />
      <text x="14" y="59" class="b-sub">• False positive identification risk</text>

      <circle cx="4" cy="85" r="3" fill="#34d399" />
      <text x="14" y="89" class="b-sub" font-weight="600" fill="#6ee7b7">Mitigation: Human-in-the-loop</text>
      <text x="14" y="104" class="b-sub" fill="#6ee7b7">التدقيق والمساءلة البشرية المستمرة</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(150, 436)">
    <rect width="700" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="350" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      <tspan font-weight="600" fill="#93c5fd">Governance Standard:</tspan> AI deployments in high-stakes domains require verifiable explainability and independent bias audits.
    </text>
  </g>
</svg>
