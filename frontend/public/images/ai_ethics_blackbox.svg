<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ethBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#140924" />
      <stop offset="100%" stop-color="#1f0d38" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="ethGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .eth-title { font-family: system-ui, sans-serif; font-weight: 800; fill: #ffffff; }
      .eth-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #d8b4fe; }
      .b-text { font-family: system-ui, sans-serif; font-weight: bold; font-size: 14px; fill: #ffffff; }
      .b-sub { font-family: system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" rx="20" fill="url(#ethBg)" />
  <rect x="2" y="2" width="996" height="496" rx="18" fill="none" stroke="#581c87" stroke-width="1.5" />

  <!-- Header -->
  <text x="500" y="42" text-anchor="middle" class="eth-title" font-size="22">⚖️ AI Ethics: Algorithmic Bias &amp; The "Black Box" Problem</text>
  <text x="500" y="65" text-anchor="middle" class="eth-sub">أخلاقيات الذكاء الاصطناعي: التحيز الخوارزمي، مشكلة الصندوق الأسود، وضرورة الشفافية</text>

  <!-- Left: Biased Training Data Input -->
  <g transform="translate(60, 120)">
    <rect width="240" height="260" rx="14" fill="#1e1b4b" stroke="#ec4899" stroke-width="2" />
    <text x="120" y="32" text-anchor="middle" class="b-text" fill="#f472b6">1. Biased Training Data</text>
    <text x="120" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fbcfe8">بيانات تدريب متحيزة تاريخياً</text>
    <line x1="20" y1="62" x2="220" y2="62" stroke="#4c1d95" stroke-width="1" />

    <!-- Details -->
    <g transform="translate(20, 80)">
      <circle cx="6" cy="6" r="4" fill="#f472b6" />
      <text x="18" y="10" class="b-sub">• Historical prejudice</text>
      <text x="18" y="26" class="b-sub">  (e.g., male hiring bias)</text>

      <circle cx="6" cy="50" r="4" fill="#f472b6" />
      <text x="18" y="54" class="b-sub">• Unbalanced demographics</text>
      <text x="18" y="70" class="b-sub">  (facial scans skew white)</text>

      <circle cx="6" cy="94" r="4" fill="#f472b6" />
      <text x="18" y="98" class="b-sub">• "Garbage In, Garbage Out"</text>
      <text x="18" y="114" class="b-sub">  المخرجات تعكس عيوب الماضي</text>
    </g>
  </g>

  <!-- Arrow Left to Center -->
  <g transform="translate(315, 235)">
    <line x1="0" y1="15" x2="60" y2="15" stroke="#ec4899" stroke-width="3" stroke-dasharray="4" />
    <polygon points="60,8 75,15 60,22" fill="#ec4899" />
  </g>

  <!-- Center: The Black Box -->
  <g transform="translate(390, 105)">
    <rect width="220" height="290" rx="16" fill="url(#boxGrad)" stroke="#a855f7" stroke-width="2.5" filter="url(#ethGlow)" />
    <!-- Lock Icon / Mystery -->
    <circle cx="110" cy="50" r="24" fill="#3b0764" stroke="#c084fc" stroke-width="2" />
    <text x="110" y="56" text-anchor="middle" font-size="18">🔒</text>

    <text x="110" y="100" text-anchor="middle" class="b-text" fill="#e9d5ff">The "Black Box"</text>
    <text x="110" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c084fc">مشكلة الصندوق الأسود</text>
    <line x1="20" y1="130" x2="200" y2="130" stroke="#3b0764" stroke-width="1" />

    <text x="20" y="155" class="b-sub">• Billions of hidden weights</text>
    <text x="20" y="175" class="b-sub">• Impossible to explain "why"</text>
    <text x="20" y="195" class="b-sub">• Lack of transparency</text>
    <text x="20" y="215" class="b-sub">• High-stakes danger in</text>
    <text x="20" y="232" class="b-sub">  medicine, law, credit</text>
    <rect x="25" y="248" width="170" height="26" rx="6" fill="#581c87" />
    <text x="110" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f5d0fe" font-weight="bold">Needs Explainable AI (XAI)</text>
  </g>

  <!-- Arrow Center to Right -->
  <g transform="translate(625, 235)">
    <line x1="0" y1="15" x2="60" y2="15" stroke="#ef4444" stroke-width="3" stroke-dasharray="4" />
    <polygon points="60,8 75,15 60,22" fill="#ef4444" />
  </g>

  <!-- Right: Unfair Output & Harm -->
  <g transform="translate(700, 120)">
    <rect width="240" height="260" rx="14" fill="#1e1b4b" stroke="#ef4444" stroke-width="2" />
    <text x="120" y="32" text-anchor="middle" class="b-text" fill="#f87171">3. Harmful Outcomes</text>
    <text x="120" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fca5a5">النتائج والقرارات المتحيزة</text>
    <line x1="20" y1="62" x2="220" y2="62" stroke="#4c1d95" stroke-width="1" />

    <!-- Details -->
    <g transform="translate(20, 80)">
      <circle cx="6" cy="6" r="4" fill="#ef4444" />
      <text x="18" y="10" class="b-sub">• Qualified women filtered out</text>

      <circle cx="6" cy="35" r="4" fill="#ef4444" />
      <text x="18" y="39" class="b-sub">• Unfair loan rejections</text>

      <circle cx="6" cy="65" r="4" fill="#ef4444" />
      <text x="18" y="69" class="b-sub">• False criminal identification</text>

      <circle cx="6" cy="95" r="4" fill="#10b981" />
      <text x="18" y="99" class="b-sub" font-weight="bold" fill="#6ee7b7">✓ Solution: Human Oversight</text>
      <text x="18" y="115" class="b-sub" fill="#a7f3d0">  والتدقيق البشري المستمر</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(150, 435)">
    <rect width="700" height="36" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1" />
    <text x="350" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f3e8ff">
      💡 <tspan font-weight="bold">Core Ethics Principle:</tspan> AI must serve humanity fairly; algorithms must be auditable, transparent, and legally accountable.
    </text>
  </g>
</svg>
