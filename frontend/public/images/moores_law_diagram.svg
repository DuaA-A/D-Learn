<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="85%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <style>
      .txt-title { font-family: system-ui, sans-serif; font-weight: 800; fill: #ffffff; }
      .txt-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .axis-label { font-family: monospace; font-size: 11px; fill: #64748b; }
      .legend { font-family: system-ui, sans-serif; font-size: 12px; fill: #e2e8f0; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="20" fill="url(#mlBg)" />
  <rect x="2" y="2" width="996" height="476" rx="18" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Header -->
  <text x="500" y="42" text-anchor="middle" class="txt-title" font-size="22">⚡ Moore's Law: The Growth &amp; The Physical Limit</text>
  <text x="500" y="65" text-anchor="middle" class="txt-sub">قانون مور: تضاعف الترانزستورات كل عامين، بلوغ الحدود الفيزيائية، والبدائل الحديثة</text>

  <!-- Left: The Exponential Chart -->
  <g transform="translate(60, 100)">
    <!-- Axes -->
    <line x1="60" y1="280" x2="440" y2="280" stroke="#475569" stroke-width="2" />
    <line x1="60" y1="40" x2="60" y2="280" stroke="#475569" stroke-width="2" />

    <!-- Grid lines -->
    <line x1="60" y1="220" x2="440" y2="220" stroke="#1e293b" stroke-width="1" stroke-dasharray="4" />
    <line x1="60" y1="160" x2="440" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="4" />
    <line x1="60" y1="100" x2="440" y2="100" stroke="#1e293b" stroke-width="1" stroke-dasharray="4" />

    <!-- Axis Labels -->
    <text x="250" y="305" text-anchor="middle" class="axis-label">Years / الأعوام (1970 - 2026)</text>
    <text x="35" y="50" text-anchor="middle" class="axis-label" transform="rotate(-90, 35, 50)">Transistors / عدد الترانزستورات</text>

    <!-- Exponential Growth Curve -->
    <path d="M 60 270 Q 240 265 320 180 T 390 75" fill="none" stroke="url(#curveGrad)" stroke-width="4.5" />
    
    <!-- Flat Plateau Limit Line -->
    <path d="M 390 75 Q 420 70 440 68" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4" />

    <!-- Physical Limit Marker -->
    <circle cx="390" cy="75" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <rect x="300" y="25" width="130" height="35" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
    <text x="365" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">Physical Wall!</text>
    <text x="365" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fecaca">الحد الفيزيائي</text>

    <!-- Transistor Doubling label -->
    <text x="140" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#93c5fd" font-weight="bold">Doubles every 2 years</text>
    <text x="140" y="235" font-family="system-ui, sans-serif" font-size="10" fill="#60a5fa">يتضاعف كل عامين تقريبًا</text>
  </g>

  <!-- Right: The Bottlenecks & Solutions Cards -->
  <g transform="translate(540, 95)">
    <!-- Card 1: Physical Bottlenecks -->
    <rect width="400" height="135" rx="14" fill="url(#cardGrad1)" stroke="#ef4444" stroke-width="1.5" />
    <g transform="translate(18, 25)">
      <circle cx="12" cy="5" r="10" fill="#7f1d1d" />
      <text x="12" y="10" text-anchor="middle" font-size="12" fill="#f87171" font-weight="bold">!</text>
      <text x="32" y="10" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#fca5a5">Physical Bottlenecks / مشكلات التصغير</text>
      
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• <tspan font-weight="bold" fill="#f87171">Quantum Tunneling (تأثير النفق الكمومي):</tspan></text>
      <text x="22" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Electrons leak through sub-atomic barriers (تسرب الإلكترونات)</text>

      <text x="10" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• <tspan font-weight="bold" fill="#f87171">Heat &amp; Leakage Current (الحرارة والتسرب):</tspan></text>
      <text x="22" y="97" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Massive energy waste &amp; thermal dissipation limits</text>
    </g>

    <!-- Card 2: Modern Paradigm Solutions -->
    <g transform="translate(0, 150)">
      <rect width="400" height="135" rx="14" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5" />
      <g transform="translate(18, 25)">
        <circle cx="12" cy="5" r="10" fill="#064e3b" />
        <text x="12" y="9" text-anchor="middle" font-size="12" fill="#34d399" font-weight="bold">✓</text>
        <text x="32" y="10" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#6ee7b7">New Directions / الاتجاهات الحديثة</text>

        <text x="10" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• <tspan font-weight="bold" fill="#34d399">Parallel Multi-Core (المعالجة المتوازية):</tspan></text>
        <text x="22" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Multiple CPU/GPU cores collaborating on tasks</text>

        <text x="10" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• <tspan font-weight="bold" fill="#34d399">Quantum Computing (الحواسيب الكمومية):</tspan></text>
        <text x="22" y="97" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Qubits utilizing Superposition to solve millions of states</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(150, 420)">
    <rect width="700" height="34" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text x="350" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c7d2fe">
      💡 Moore's law drove silicon speeds for 50 years; today, parallel architectures &amp; quantum physics lead the future.
    </text>
  </g>
</svg>
