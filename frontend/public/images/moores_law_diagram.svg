<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
      .txt-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .axis-label { font-family: "SF Mono", Consolas, monospace; font-size: 11px; fill: #64748b; }
      .card-header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 13.5px; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="12" fill="url(#mlBg)" />
  <rect x="1.5" y="1.5" width="997" height="477" rx="11" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Header -->
  <text x="500" y="44" text-anchor="middle" class="txt-title" font-size="20">Moore's Law: Growth Trend and Physical Scaling Limits</text>
  <text x="500" y="66" text-anchor="middle" class="txt-sub">قانون مور: تضاعف الترانزستورات كل عامين، بلوغ الحدود الفيزيائية، والبدائل الهندسية</text>

  <!-- Left: The Exponential Chart -->
  <g transform="translate(60, 95)">
    <!-- Axes -->
    <line x1="60" y1="280" x2="440" y2="280" stroke="#475569" stroke-width="1.5" />
    <line x1="60" y1="40" x2="60" y2="280" stroke="#475569" stroke-width="1.5" />

    <!-- Grid lines -->
    <line x1="60" y1="220" x2="440" y2="220" stroke="#1e293b" stroke-width="1" stroke-dasharray="3" />
    <line x1="60" y1="160" x2="440" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="3" />
    <line x1="60" y1="100" x2="440" y2="100" stroke="#1e293b" stroke-width="1" stroke-dasharray="3" />

    <!-- Axis Labels -->
    <text x="250" y="305" text-anchor="middle" class="axis-label">Years / الأعوام (1970 - 2026)</text>
    <text x="35" y="50" text-anchor="middle" class="axis-label" transform="rotate(-90, 35, 50)">Transistor Count / عدد الترانزستورات</text>

    <!-- Exponential Growth Curve -->
    <path d="M 60 270 Q 240 265 320 180 T 390 75" fill="none" stroke="url(#curveGrad)" stroke-width="3.5" />
    
    <!-- Flat Plateau Limit Line -->
    <path d="M 390 75 Q 420 70 440 68" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4" />

    <!-- Physical Limit Marker -->
    <circle cx="390" cy="75" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" />
    <rect x="305" y="28" width="130" height="32" rx="4" fill="#1e293b" stroke="#dc2626" stroke-width="1" />
    <text x="370" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#fca5a5">Physical Limit Wall</text>
    <text x="370" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8">الحدود الفيزيائية للتصغير</text>

    <!-- Transistor Doubling label -->
    <text x="140" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#93c5fd" font-weight="600">Doubles ~ Every 2 Years</text>
    <text x="140" y="230" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">تضاعف كثافة الترانزستورات دورياً</text>
  </g>

  <!-- Right: Technical Limits & Architecture Solutions -->
  <g transform="translate(540, 95)">
    <!-- Box 1: Physical Bottlenecks -->
    <rect width="400" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <g transform="translate(18, 22)">
      <circle cx="6" cy="4" r="3.5" fill="#f87171" />
      <text x="16" y="8" class="card-header" fill="#fca5a5">Physical Bottlenecks / التحديات الفيزيائية</text>
      
      <text x="16" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#f1f5f9" font-weight="500">• Quantum Tunneling (النفق الكمومي):</text>
      <text x="24" y="53" class="body-txt">Electrons breach sub-atomic insulation barriers, causing data leakage.</text>

      <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#f1f5f9" font-weight="500">• Thermal Dissipation &amp; Leakage (الحرارة والتسرب):</text>
      <text x="24" y="95" class="body-txt">Excessive heat generation hinders simultaneous frequency scaling.</text>
    </g>

    <!-- Box 2: Engineering Solutions -->
    <g transform="translate(0, 150)">
      <rect width="400" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <g transform="translate(18, 22)">
        <circle cx="6" cy="4" r="3.5" fill="#34d399" />
        <text x="16" y="8" class="card-header" fill="#6ee7b7">Architectural Solutions / الحلول الهندسية</text>

        <text x="16" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#f1f5f9" font-weight="500">• Multi-Core Parallel Processing (المعالجة المتوازية):</text>
        <text x="24" y="53" class="body-txt">Distributing workloads across multiple specialized cores (CPU/GPU).</text>

        <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#f1f5f9" font-weight="500">• Quantum Computing (الحوسبة الكمومية):</text>
        <text x="24" y="95" class="body-txt">Qubits utilizing quantum superposition to solve complex states.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(150, 422)">
    <rect width="700" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="350" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      <tspan font-weight="600" fill="#93c5fd">Summary:</tspan> As single-core physical scaling plateaued, computing shifted from raw clock speeds to parallel architectures.
    </text>
  </g>
</svg>
