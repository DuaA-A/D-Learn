<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="cSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .txt-head { font-family: system-ui, sans-serif; font-weight: 900; fill: #ffffff; }
      .txt-subh { font-family: system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .circle-label { font-family: system-ui, sans-serif; font-weight: 900; text-anchor: middle; }
      .card-h { font-family: system-ui, sans-serif; font-weight: bold; font-size: 14px; fill: #f8fafc; }
      .card-p { font-family: system-ui, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" rx="24" fill="url(#aiBg)" />
  <rect x="2" y="2" width="1096" height="676" rx="22" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="550" y="42" text-anchor="middle" class="txt-head" font-size="22">🧠 Lesson 1.2 Complete Mindmap: The AI Hierarchy &amp; Mechanism</text>
  <text x="550" y="64" text-anchor="middle" class="txt-subh">خريطة مفاهيمية شاملة: علاقة الذكاء الاصطناعي وتعلم الآلة والتعلم العميق والذكاء التوليدي</text>

  <!-- Left Side: The Concentric Nesting (AI ⊃ ML ⊃ DL ⊃ GenAI) -->
  <g transform="translate(40, 90)">
    <!-- Title for diagram -->
    <text x="230" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#38bdf8">
      AI ⊃ Machine Learning ⊃ Deep Learning ⊃ GenAI
    </text>

    <!-- Outer Sphere: Artificial Intelligence -->
    <ellipse cx="230" cy="270" rx="220" ry="210" fill="#1e293b" fill-opacity="0.4" stroke="#3b82f6" stroke-width="3" />
    <text x="230" y="90" class="circle-label" fill="#60a5fa" font-size="16">1. Artificial Intelligence (AI)</text>
    <text x="230" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#93c5fd">الذكاء الاصطناعي (المظلة الكبرى)</text>

    <!-- Mid Layer 1: Machine Learning -->
    <ellipse cx="230" cy="290" rx="170" ry="160" fill="#312e81" fill-opacity="0.35" stroke="#8b5cf6" stroke-width="2.5" />
    <text x="230" y="165" class="circle-label" fill="#a78bfa" font-size="15">2. Machine Learning (ML)</text>
    <text x="230" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd">تعلم الآلة (تعلم القواعد من البيانات)</text>

    <!-- Mid Layer 2: Deep Learning -->
    <ellipse cx="230" cy="320" rx="120" ry="110" fill="#831843" fill-opacity="0.35" stroke="#ec4899" stroke-width="2.5" />
    <text x="230" y="240" class="circle-label" fill="#f472b6" font-size="14">3. Deep Learning (DL)</text>
    <text x="230" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fbcfe8">التعلم العميق (شبكات عصبية ضخمة)</text>

    <!-- Core: Generative AI -->
    <ellipse cx="230" cy="355" rx="70" ry="60" fill="#065f46" fill-opacity="0.8" stroke="#10b981" stroke-width="3" filter="url(#cSoftGlow)" />
    <text x="230" y="345" class="circle-label" fill="#ffffff" font-size="13">4. GenAI</text>
    <text x="230" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0">الذكاء التوليدي</text>
    <text x="230" y="378" text-anchor="middle" font-family="monospace" font-size="9" fill="#d1fae5">ChatGPT / DALL-E</text>
  </g>

  <!-- Right Side: Detailed Component Cards -->
  <g transform="translate(540, 95)">
    <!-- Card 1: AI (Narrow vs General) -->
    <rect width="500" height="115" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <g transform="translate(20, 24)">
      <text x="0" y="0" class="card-h" fill="#60a5fa">🌐 Artificial Intelligence (Narrow AI)</text>
      <text x="0" y="22" class="card-p">• Broad field: Simulating human perception, reasoning, and judgment.</text>
      <text x="0" y="42" class="card-p">• <tspan font-weight="bold" fill="#93c5fd">Narrow AI (الذكاء الضيق):</tspan> Excels at one specialized task only (e.g. spam, chess).</text>
      <text x="0" y="62" class="card-p">• <tspan font-weight="bold" fill="#f87171">Not General:</tspan> Does NOT possess general human consciousness or cross-domain mind.</text>
    </g>

    <!-- Card 2: Machine Learning -->
    <g transform="translate(0, 130)">
      <rect width="500" height="115" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
      <g transform="translate(20, 24)">
        <text x="0" y="0" class="card-h" fill="#a78bfa">📊 Machine Learning: Data-Driven Rules</text>
        <text x="0" y="22" class="card-p">• <tspan font-weight="bold" fill="#c4b5fd">Traditional code:</tspan> Rules + Data → Answers.</text>
        <text x="0" y="42" class="card-p">• <tspan font-weight="bold" fill="#c4b5fd">Machine Learning:</tspan> Data + Answers → Automatically Learns the Rules!</text>
        <text x="0" y="62" class="card-p">• Used in: Spam filters, Fraud detection, E-commerce recommendation algorithms.</text>
      </g>
    </g>

    <!-- Card 3: Deep Learning & Neural Networks -->
    <g transform="translate(0, 260)">
      <rect width="500" height="115" rx="12" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
      <g transform="translate(20, 24)">
        <text x="0" y="0" class="card-h" fill="#f472b6">🕸️ Deep Learning: Neural Network Synapses</text>
        <text x="0" y="22" class="card-p">• Inspired by human brain neurons (Input Layer → Hidden Layers → Output Layer).</text>
        <text x="0" y="42" class="card-p">• Learns hierarchical abstractions through millions of numerical <tspan font-weight="bold" fill="#f472b6">weights</tspan>.</text>
        <text x="0" y="62" class="card-p">• Requires huge training data &amp; high-performance computing (GPUs/TPUs).</text>
      </g>
    </g>

    <!-- Card 4: Generative AI & Hallucination Alert -->
    <g transform="translate(0, 390)">
      <rect width="500" height="120" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <g transform="translate(20, 24)">
        <text x="0" y="0" class="card-h" fill="#34d399">✨ Generative AI &amp; The Hallucination Rule</text>
        <text x="0" y="20" class="card-p">• Creates novel content: text, code, high-res images, music, 3D assets.</text>
        <text x="0" y="40" class="card-p">• <tspan font-weight="bold" fill="#fbbf24">Hallucination (هلوسة):</tspan> Produces fluent, plausible text that is factually false.</text>
        <text x="0" y="60" class="card-p" fill="#fca5a5">⚠️ Mandatory Rule: Always verify AI answers with credible, trusted primary sources!</text>
      </g>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(150, 630)">
    <rect width="800" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="400" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c7d2fe">
      💡 <tspan font-weight="bold">Core Connection:</tspan> Deep Learning is the engine that unlocked Generative AI; both remain forms of Narrow AI.
    </text>
  </g>
</svg>
