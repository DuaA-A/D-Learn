<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <style>
      .txt-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
      .txt-subh { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .circle-label { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; text-anchor: middle; }
      .card-h { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 13.5px; fill: #f8fafc; }
      .card-p { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" rx="12" fill="url(#aiBg)" />
  <rect x="1.5" y="1.5" width="1097" height="677" rx="11" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Header -->
  <text x="550" y="44" text-anchor="middle" class="txt-head" font-size="20">Lesson 1.2 Concept Map: The AI Technology Hierarchy</text>
  <text x="550" y="66" text-anchor="middle" class="txt-subh">خريطة مفاهيمية: العلاقة الهرمية بين الذكاء الاصطناعي وتعلم الآلة والتعلم العميق والتوليدي</text>

  <!-- Left Side: Concentric Venn Diagram (AI ⊃ ML ⊃ DL ⊃ GenAI) -->
  <g transform="translate(40, 95)">
    <text x="230" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13" fill="#38bdf8">
      AI ⊃ Machine Learning ⊃ Deep Learning ⊃ Generative AI
    </text>

    <!-- Outer Sphere: Artificial Intelligence -->
    <ellipse cx="230" cy="265" rx="220" ry="210" fill="#1e293b" fill-opacity="0.5" stroke="#3b82f6" stroke-width="2" />
    <text x="230" y="85" class="circle-label" fill="#93c5fd" font-size="15">1. Artificial Intelligence (AI)</text>
    <text x="230" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">الذكاء الاصطناعي (المفهوم الشامل)</text>

    <!-- Mid Layer 1: Machine Learning -->
    <ellipse cx="230" cy="285" rx="170" ry="160" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-width="1.8" />
    <text x="230" y="158" class="circle-label" fill="#a5b4fc" font-size="14">2. Machine Learning (ML)</text>
    <text x="230" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">تعلم الآلة (استنتاج القواعد من البيانات)</text>

    <!-- Mid Layer 2: Deep Learning -->
    <ellipse cx="230" cy="315" rx="120" ry="110" fill="#312e81" fill-opacity="0.5" stroke="#8b5cf6" stroke-width="1.8" />
    <text x="230" y="235" class="circle-label" fill="#c4b5fd" font-size="13.5">3. Deep Learning (DL)</text>
    <text x="230" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8">التعلم العميق (الشبكات العصبية)</text>

    <!-- Core: Generative AI -->
    <ellipse cx="230" cy="350" rx="70" ry="60" fill="#065f46" stroke="#10b981" stroke-width="2" />
    <text x="230" y="340" class="circle-label" fill="#ffffff" font-size="12.5">4. GenAI</text>
    <text x="230" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#a7f3d0">الذكاء التوليدي</text>
    <text x="230" y="372" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#d1fae5">LLMs / Synthesis</text>
  </g>

  <!-- Right Side: Detailed Component Cards -->
  <g transform="translate(540, 95)">
    <!-- Card 1: AI (Narrow vs General) -->
    <rect width="500" height="115" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <g transform="translate(18, 22)">
      <text x="0" y="0" class="card-h" fill="#93c5fd">Artificial Intelligence (Narrow AI)</text>
      <text x="0" y="22" class="card-p">• General field: Simulating cognitive capabilities (learning, reasoning, inference).</text>
      <text x="0" y="42" class="card-p">• <tspan font-weight="600" fill="#f1f5f9">Narrow AI (الذكاء الضيق):</tspan> Highly proficient in dedicated, specific tasks.</text>
      <text x="0" y="62" class="card-p">• <tspan font-weight="600" fill="#f87171">Scope Boundary:</tspan> Current systems lack general human consciousness across domains.</text>
    </g>

    <!-- Card 2: Machine Learning -->
    <g transform="translate(0, 130)">
      <rect width="500" height="115" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <g transform="translate(18, 22)">
        <text x="0" y="0" class="card-h" fill="#a5b4fc">Machine Learning: Data-Driven Modeling</text>
        <text x="0" y="22" class="card-p">• <tspan font-weight="600" fill="#f1f5f9">Classical Computing:</tspan> Explicit rules + input data = answers.</text>
        <text x="0" y="42" class="card-p">• <tspan font-weight="600" fill="#f1f5f9">Machine Learning:</tspan> Input data + observed answers = learned predictive rules.</text>
        <text x="0" y="62" class="card-p">• Applications: Spam classification, fraud detection, recommendation engines.</text>
      </g>
    </g>

    <!-- Card 3: Deep Learning -->
    <g transform="translate(0, 260)">
      <rect width="500" height="115" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <g transform="translate(18, 22)">
        <text x="0" y="0" class="card-h" fill="#c4b5fd">Deep Learning: Multi-Layer Neural Networks</text>
        <text x="0" y="22" class="card-p">• Modeled after brain neural synapses: Input layer → Hidden layers → Output.</text>
        <text x="0" y="42" class="card-p">• Learns multi-level representations through continuous numerical weight adjustments.</text>
        <text x="0" y="62" class="card-p">• Dependent on large datasets and hardware acceleration (GPUs/TPUs).</text>
      </g>
    </g>

    <!-- Card 4: Generative AI -->
    <g transform="translate(0, 390)">
      <rect width="500" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <g transform="translate(18, 22)">
        <text x="0" y="0" class="card-h" fill="#6ee7b7">Generative AI: Synthesis &amp; Verification Protocol</text>
        <text x="0" y="20" class="card-p">• Synthesizes new modalities: text, code, high-resolution imagery, and audio.</text>
        <text x="0" y="40" class="card-p">• <tspan font-weight="600" fill="#fde68a">Hallucination Risk (ظاهرة الهلوسة):</tspan> Generates plausible yet factually incorrect output.</text>
        <text x="0" y="60" class="card-p" fill="#fca5a5">• Verification Guideline: Always cross-verify generative outputs with primary authoritative sources.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(150, 632)">
    <rect width="800" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="400" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      <tspan font-weight="600" fill="#93c5fd">Architectural Hierarchy:</tspan> Deep learning serves as the foundational substrate for generative models; all remain specialized Narrow AI systems.
    </text>
  </g>
</svg>
