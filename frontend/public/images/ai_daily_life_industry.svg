<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="softShdw" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <style>
      .hdr13 { font-family: system-ui, sans-serif; font-weight: 800; fill: #ffffff; }
      .sub13 { font-family: system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .col-h { font-family: system-ui, sans-serif; font-weight: bold; font-size: 16px; text-anchor: middle; }
      .col-sub { font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .item-t { font-family: system-ui, sans-serif; font-weight: bold; font-size: 13px; fill: #f8fafc; }
      .item-d { font-family: system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" rx="20" fill="url(#bg13)" />
  <rect x="2" y="2" width="996" height="496" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="500" y="40" text-anchor="middle" class="hdr13" font-size="22">🌐 Dual Impact: AI in Daily Life vs AI in Industry</text>
  <text x="500" y="63" text-anchor="middle" class="sub13">تطبيقات الذكاء الاصطناعي: مقارنة بين الحياة اليومية والقطاعات الصناعية الكبرى</text>

  <!-- LEFT COLUMN: DAILY LIFE -->
  <g transform="translate(50, 90)">
    <rect width="420" height="340" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="2" filter="url(#softShdw)" />
    <!-- Column Top Header -->
    <rect width="420" height="42" rx="16" fill="#0369a1" />
    <text x="210" y="26" class="col-h" fill="#ffffff">📱 AI in Daily Life / الحياة اليومية</text>

    <!-- Item 1: Communication -->
    <g transform="translate(20, 60)">
      <circle cx="14" cy="12" r="10" fill="#0284c7" />
      <text x="14" y="16" text-anchor="middle" font-size="11" fill="#ffffff">💬</text>
      <text x="34" y="16" class="item-t">Communication &amp; Voice</text>
      <text x="34" y="32" class="item-d">Siri, Alexa, Google Translate, Predictive Autocorrect</text>
    </g>

    <!-- Item 2: Shopping & Entertainment -->
    <g transform="translate(20, 125)">
      <circle cx="14" cy="12" r="10" fill="#0284c7" />
      <text x="14" y="16" text-anchor="middle" font-size="11" fill="#ffffff">🛍️</text>
      <text x="34" y="16" class="item-t">Shopping &amp; Entertainment</text>
      <text x="34" y="32" class="item-d">Netflix recommendations, Amazon feeds, Fraud check</text>
    </g>

    <!-- Item 3: Health & Diagnostics -->
    <g transform="translate(20, 190)">
      <circle cx="14" cy="12" r="10" fill="#0284c7" />
      <text x="14" y="16" text-anchor="middle" font-size="11" fill="#ffffff">❤️</text>
      <text x="34" y="16" class="item-t">Personal Health &amp; Wearables</text>
      <text x="34" y="32" class="item-d">Smartwatch cardiac monitors, emergency fall detection</text>
    </g>

    <!-- Item 4: Personalized Education -->
    <g transform="translate(20, 255)">
      <circle cx="14" cy="12" r="10" fill="#0284c7" />
      <text x="14" y="16" text-anchor="middle" font-size="11" fill="#ffffff">🎓</text>
      <text x="34" y="16" class="item-t">Adaptive Smart Learning</text>
      <text x="34" y="32" class="item-d">Adaptive difficulty, AI tutors, instant essay evaluation</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: INDUSTRY -->
  <g transform="translate(530, 90)">
    <rect width="420" height="340" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="2" filter="url(#softShdw)" />
    <!-- Column Top Header -->
    <rect width="420" height="42" rx="16" fill="#047857" />
    <text x="210" y="26" class="col-h" fill="#ffffff">🏭 AI in Industry / القطاعات الصناعية</text>

    <!-- Item 1: Manufacturing -->
    <g transform="translate(20, 60)">
      <circle cx="14" cy="12" r="10" fill="#059669" />
      <text x="14" y="16" text-anchor="middle" font-size="11" fill="#ffffff">⚙️</text>
      <text x="34" y="16" class="item-t">Smart Manufacturing</text>
      <text x="34" y="32" class="item-d">Predictive maintenance, computer vision QA, robot arms</text>
    </g>

    <!-- Item 2: Agriculture -->
    <g transform="translate(20, 125)">
      <circle cx="14" cy="12" r="10" fill="#059669" />
      <text x="14" y="16" text-anchor="middle" font-size="11" fill="#ffffff">🌾</text>
      <text x="34" y="16" class="item-t">Precision Agriculture</text>
      <text x="34" y="32" class="item-d">Crop disease detection, fertilizer &amp; water optimization</text>
    </g>

    <!-- Item 3: Finance & Banking -->
    <g transform="translate(20, 190)">
      <circle cx="14" cy="12" r="10" fill="#059669" />
      <text x="14" y="16" text-anchor="middle" font-size="11" fill="#ffffff">📈</text>
      <text x="34" y="16" class="item-t">FinTech &amp; Algorithmic Trading</text>
      <text x="34" y="32" class="item-d">High-frequency trading, anti-money laundering (AML)</text>
    </g>

    <!-- Item 4: Transportation & Logistics -->
    <g transform="translate(20, 255)">
      <circle cx="14" cy="12" r="10" fill="#059669" />
      <text x="14" y="16" text-anchor="middle" font-size="11" fill="#ffffff">🚚</text>
      <text x="34" y="16" class="item-t">Autonomous Mobility</text>
      <text x="34" y="32" class="item-d">Autonomous fleets, dynamic route planning, drone delivery</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(150, 448)">
    <rect width="700" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="350" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#93c5fd">
      💡 All these systems are powered by <tspan font-weight="bold" fill="#ffffff">Narrow AI</tspan> specialized in pattern recognition.
    </text>
  </g>
</svg>
