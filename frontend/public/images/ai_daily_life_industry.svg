<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <style>
      .hdr13 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
      .sub13 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .col-h { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 15px; text-anchor: middle; }
      .item-num { font-family: "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .item-t { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 12.5px; fill: #f8fafc; }
      .item-d { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" rx="12" fill="url(#bg13)" />
  <rect x="1.5" y="1.5" width="997" height="477" rx="11" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Header -->
  <text x="500" y="44" text-anchor="middle" class="hdr13" font-size="20">Applied Artificial Intelligence: Daily Life vs Industry</text>
  <text x="500" y="66" text-anchor="middle" class="sub13">تطبيقات الذكاء الاصطناعي: مقارنة بين الحياة اليومية والقطاعات الصناعية الكبرى</text>

  <!-- LEFT COLUMN: DAILY LIFE -->
  <g transform="translate(50, 95)">
    <rect width="420" height="330" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="420" height="36" rx="8" fill="#0f172a" />
    <text x="210" y="23" class="col-h" fill="#93c5fd">Consumer &amp; Daily Life / الحياة اليومية</text>

    <!-- Item 1 -->
    <g transform="translate(20, 55)">
      <circle cx="12" cy="12" r="10" fill="#0284c7" />
      <text x="12" y="16" class="item-num" fill="#ffffff">1</text>
      <text x="32" y="16" class="item-t">Natural Language &amp; Assistants</text>
      <text x="32" y="32" class="item-d">Voice assistants, automated translation, autocorrect</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 120)">
      <circle cx="12" cy="12" r="10" fill="#0284c7" />
      <text x="12" y="16" class="item-num" fill="#ffffff">2</text>
      <text x="32" y="16" class="item-t">E-Commerce &amp; Entertainment</text>
      <text x="32" y="32" class="item-d">Content feeds, product recommendation models, fraud detection</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(20, 185)">
      <circle cx="12" cy="12" r="10" fill="#0284c7" />
      <text x="12" y="16" class="item-num" fill="#ffffff">3</text>
      <text x="32" y="16" class="item-t">Wearable Health &amp; Safety</text>
      <text x="32" y="32" class="item-d">Cardiac rhythm analysis, biometric anomaly notifications</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(20, 250)">
      <circle cx="12" cy="12" r="10" fill="#0284c7" />
      <text x="12" y="16" class="item-num" fill="#ffffff">4</text>
      <text x="32" y="16" class="item-t">Adaptive Education Platforms</text>
      <text x="32" y="32" class="item-d">Personalized problem difficulty and automated rubric feedback</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: INDUSTRY -->
  <g transform="translate(530, 95)">
    <rect width="420" height="330" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="420" height="36" rx="8" fill="#0f172a" />
    <text x="210" y="23" class="col-h" fill="#6ee7b7">Industrial &amp; Enterprise / القطاعات الصناعية</text>

    <!-- Item 1 -->
    <g transform="translate(20, 55)">
      <circle cx="12" cy="12" r="10" fill="#059669" />
      <text x="12" y="16" class="item-num" fill="#ffffff">1</text>
      <text x="32" y="16" class="item-t">Smart Manufacturing &amp; QA</text>
      <text x="32" y="32" class="item-d">Sensor-based predictive maintenance, computer vision inspection</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 120)">
      <circle cx="12" cy="12" r="10" fill="#059669" />
      <text x="12" y="16" class="item-num" fill="#ffffff">2</text>
      <text x="32" y="16" class="item-t">Precision Agriculture</text>
      <text x="32" y="32" class="item-d">Crop pathology imaging, irrigation and fertilizer optimization</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(20, 185)">
      <circle cx="12" cy="12" r="10" fill="#059669" />
      <text x="12" y="16" class="item-num" fill="#ffffff">3</text>
      <text x="32" y="16" class="item-t">FinTech &amp; Algorithmic Modeling</text>
      <text x="32" y="32" class="item-d">High-frequency risk calculation, credit scoring, AML compliance</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(20, 250)">
      <circle cx="12" cy="12" r="10" fill="#059669" />
      <text x="12" y="16" class="item-num" fill="#ffffff">4</text>
      <text x="32" y="16" class="item-t">Autonomous Mobility &amp; Logistics</text>
      <text x="32" y="32" class="item-d">Fleet route optimization, obstacle perception, edge telemetry</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(150, 444)">
    <rect width="700" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="350" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      <tspan font-weight="600" fill="#93c5fd">Common Principle:</tspan> Both consumer and industrial implementations employ dedicated Narrow AI models trained on statistical historical data.
    </text>
  </g>
</svg>
