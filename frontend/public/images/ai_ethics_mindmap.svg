<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEthMm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
      .subhdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; fill: #f8fafc; font-size: 12.5px; }
      .leaf-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" rx="12" fill="url(#bgEthMm)" />
  <rect x="1.5" y="1.5" width="1097" height="677" rx="11" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Top Title -->
  <text x="550" y="44" text-anchor="middle" class="hdr" font-size="20">Lesson 1.4 Concept Map: Ethical AI Governance Framework</text>
  <text x="550" y="66" text-anchor="middle" class="subhdr">خريطة مفاهيمية: الركائز الست لأخلاقيات الذكاء الاصطناعي والحوكمة المسؤولة</text>

  <!-- Center Hub -->
  <g transform="translate(550, 340)">
    <circle r="60" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#ffffff">Responsible</text>
    <text y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#c4b5fd">AI Governance</text>
    <text y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#a78bfa">الأخلاقيات والحوكمة</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M 490 300 C 370 250, 310 170, 240 150" fill="none" stroke="#ec4899" stroke-width="1.8" stroke-dasharray="3" />
  <path d="M 480 340 L 370 340" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="3" />
  <path d="M 490 380 C 370 430, 310 510, 240 530" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3" />

  <path d="M 610 300 C 730 250, 790 170, 860 150" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="3" />
  <path d="M 620 340 L 730 340" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="3" />
  <path d="M 610 380 C 730 430, 790 510, 860 530" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3" />

  <!-- 1. BIAS & FAIRNESS (Top-Left) -->
  <g transform="translate(50, 80)">
    <rect width="310" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="310" height="28" rx="8" fill="#0f172a" />
    <text x="12" y="19" class="node-text">1. Bias &amp; Fairness / التحيز والعدالة</text>
    <g transform="translate(12, 42)">
      <circle cx="4" cy="5" r="3" fill="#f472b6" />
      <text x="14" y="9" class="leaf-text">• Training data reflects historical prejudice</text>
      <circle cx="4" cy="27" r="3" fill="#f472b6" />
      <text x="14" y="31" class="leaf-text">• Algorithmic discrimination in hiring &amp; credit</text>
      <circle cx="4" cy="49" r="3" fill="#34d399" />
      <text x="14" y="53" class="leaf-text" fill="#6ee7b7">Mitigation: Representative data &amp; fairness audits</text>
    </g>
  </g>

  <!-- 2. PRIVACY & SURVEILLANCE (Mid-Left) -->
  <g transform="translate(50, 275)">
    <rect width="310" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="310" height="28" rx="8" fill="#0f172a" />
    <text x="12" y="19" class="node-text">2. Privacy &amp; Data Rights / الخصوصية</text>
    <g transform="translate(12, 42)">
      <circle cx="4" cy="5" r="3" fill="#38bdf8" />
      <text x="14" y="9" class="leaf-text">• Massive personal data harvesting at scale</text>
      <circle cx="4" cy="27" r="3" fill="#38bdf8" />
      <text x="14" y="31" class="leaf-text">• Facial tracking and biometric privacy concerns</text>
      <circle cx="4" cy="49" r="3" fill="#34d399" />
      <text x="14" y="53" class="leaf-text" fill="#6ee7b7">Mitigation: Data minimization &amp; user consent</text>
    </g>
  </g>

  <!-- 3. JOB DISPLACEMENT (Bottom-Left) -->
  <g transform="translate(50, 470)">
    <rect width="310" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="310" height="28" rx="8" fill="#0f172a" />
    <text x="12" y="19" class="node-text">3. Labor &amp; Automation / التهجير الوظيفي</text>
    <g transform="translate(12, 42)">
      <circle cx="4" cy="5" r="3" fill="#fbbf24" />
      <text x="14" y="9" class="leaf-text">• Automation of routine cognitive &amp; physical tasks</text>
      <circle cx="4" cy="27" r="3" fill="#fbbf24" />
      <text x="14" y="31" class="leaf-text">• Displacement risk in administration &amp; logistics</text>
      <circle cx="4" cy="49" r="3" fill="#34d399" />
      <text x="14" y="53" class="leaf-text" fill="#6ee7b7">Mitigation: Workforce reskilling &amp; transition policy</text>
    </g>
  </g>

  <!-- 4. ACCOUNTABILITY (Top-Right) -->
  <g transform="translate(740, 80)">
    <rect width="310" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="310" height="28" rx="8" fill="#0f172a" />
    <text x="12" y="19" class="node-text">4. Legal Accountability / المساءلة القانونية</text>
    <g transform="translate(12, 42)">
      <circle cx="4" cy="5" r="3" fill="#a78bfa" />
      <text x="14" y="9" class="leaf-text">• Liability attribution for autonomous failures</text>
      <circle cx="4" cy="27" r="3" fill="#a78bfa" />
      <text x="14" y="31" class="leaf-text">• Self-driving accidents &amp; clinical diagnostic errors</text>
      <circle cx="4" cy="49" r="3" fill="#34d399" />
      <text x="14" y="53" class="leaf-text" fill="#6ee7b7">Mitigation: Explicit chain-of-responsibility laws</text>
    </g>
  </g>

  <!-- 5. TRANSPARENCY & XAI (Mid-Right) -->
  <g transform="translate(740, 275)">
    <rect width="310" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="310" height="28" rx="8" fill="#0f172a" />
    <text x="12" y="19" class="node-text">5. Transparency &amp; XAI / الشفافية</text>
    <g transform="translate(12, 42)">
      <circle cx="4" cy="5" r="3" fill="#34d399" />
      <text x="14" y="9" class="leaf-text">• "Black Box": Inability to reconstruct decision paths</text>
      <circle cx="4" cy="27" r="3" fill="#34d399" />
      <text x="14" y="31" class="leaf-text">• High risks in judicial sentencing and medicine</text>
      <circle cx="4" cy="49" r="3" fill="#38bdf8" />
      <text x="14" y="53" class="leaf-text" fill="#7dd3fc">Mitigation: Explainable AI (XAI) model architectures</text>
    </g>
  </g>

  <!-- 6. MISUSE & SYNTHETIC MEDIA (Bottom-Right) -->
  <g transform="translate(740, 470)">
    <rect width="310" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="310" height="28" rx="8" fill="#0f172a" />
    <text x="12" y="19" class="node-text">6. Misuse &amp; Deepfakes / التزييف والتضليل</text>
    <g transform="translate(12, 42)">
      <circle cx="4" cy="5" r="3" fill="#f87171" />
      <text x="14" y="9" class="leaf-text">• Synthetic video and voice cloning impersonation</text>
      <circle cx="4" cy="27" r="3" fill="#f87171" />
      <text x="14" y="31" class="leaf-text">• Disinformation campaigns eroding public trust</text>
      <circle cx="4" cy="49" r="3" fill="#34d399" />
      <text x="14" y="53" class="leaf-text" fill="#6ee7b7">Mitigation: Provenance watermarking and verification</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(200, 634)">
    <rect width="700" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="350" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      <tspan font-weight="600" fill="#93c5fd">Regulatory Imperative:</tspan> Ethical AI governance ensures human oversight, algorithmic fairness, and accountability across the software lifecycle.
    </text>
  </g>
</svg>
