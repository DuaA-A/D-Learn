<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="mmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
      .subhdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: #f8fafc; font-size: 13px; }
      .leaf-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" rx="12" fill="url(#mmBg)" />
  <rect x="1.5" y="1.5" width="1097" height="677" rx="11" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Top Title -->
  <text x="550" y="44" text-anchor="middle" class="hdr" font-size="20">Lesson 1.1 Concept Map: Information Technology &amp; Society</text>
  <text x="550" y="66" text-anchor="middle" class="subhdr">خريطة مفاهيمية: تطور تكنولوجيا المعلومات، قانون مور، والتحولات الاجتماعية والتقنيات الناشئة</text>

  <!-- Center Hub -->
  <g transform="translate(550, 340)">
    <circle r="60" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#ffffff">IT Evolution</text>
    <text y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13" fill="#93c5fd">&amp; Society</text>
    <text y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#38bdf8">التحول التكنولوجي</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M 490 300 C 370 250, 320 180, 240 160" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="3" />
  <path d="M 490 380 C 370 430, 320 500, 240 520" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="3" />
  <path d="M 610 300 C 730 250, 780 180, 860 160" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="3" />
  <path d="M 610 380 C 730 430, 780 500, 860 520" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="3" />

  <!-- HUB 1: HISTORY STAGES (Top-Left) -->
  <g transform="translate(60, 80)">
    <rect width="320" height="170" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="320" height="30" rx="8" fill="#0f172a" />
    <text x="14" y="20" class="node-text">1. Historical Stages / مراحل التطور</text>

    <g transform="translate(14, 46)">
      <circle cx="4" cy="5" r="3" fill="#60a5fa" />
      <text x="14" y="9" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">1940s-60s:</tspan> ENIAC, Vacuum tubes, Military calculation</text>

      <circle cx="4" cy="28" r="3" fill="#60a5fa" />
      <text x="14" y="32" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">1970s-80s:</tspan> Personal PC, Microprocessors begin</text>

      <circle cx="4" cy="51" r="3" fill="#60a5fa" />
      <text x="14" y="55" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">1990s:</tspan> Commercial Internet, WWW, Email network</text>

      <circle cx="4" cy="74" r="3" fill="#60a5fa" />
      <text x="14" y="78" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">2000s:</tspan> Smartphones, Mobile apps, Always-on net</text>

      <circle cx="4" cy="97" r="3" fill="#60a5fa" />
      <text x="14" y="101" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">2010s+:</tspan> Cloud Computing, AI &amp; Big Data as a service</text>
    </g>
  </g>

  <!-- HUB 2: MOORE'S LAW & HARDWARE (Bottom-Left) -->
  <g transform="translate(60, 440)">
    <rect width="320" height="170" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="320" height="30" rx="8" fill="#0f172a" />
    <text x="14" y="20" class="node-text">2. Moore's Law &amp; Hardware / قانون مور والعتاد</text>

    <g transform="translate(14, 46)">
      <circle cx="4" cy="5" r="3" fill="#818cf8" />
      <text x="14" y="9" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">Observation:</tspan> Transistors double every ~2 years</text>

      <circle cx="4" cy="28" r="3" fill="#f87171" />
      <text x="14" y="32" class="leaf-text"><tspan font-weight="600" fill="#fca5a5">Quantum Tunneling:</tspan> Electron leakage at nanoscale</text>

      <circle cx="4" cy="51" r="3" fill="#f87171" />
      <text x="14" y="55" class="leaf-text"><tspan font-weight="600" fill="#fca5a5">Heat Limits:</tspan> High power density and thermal walls</text>

      <circle cx="4" cy="74" r="3" fill="#34d399" />
      <text x="14" y="78" class="leaf-text"><tspan font-weight="600" fill="#6ee7b7">Parallel Multi-core:</tspan> Multi-processor workload sharing</text>

      <circle cx="4" cy="97" r="3" fill="#34d399" />
      <text x="14" y="101" class="leaf-text"><tspan font-weight="600" fill="#6ee7b7">Quantum Bits (Qubits):</tspan> Superposition computation</text>
    </g>
  </g>

  <!-- HUB 3: SOCIAL CHANGES (Top-Right) -->
  <g transform="translate(720, 80)">
    <rect width="320" height="170" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="320" height="30" rx="8" fill="#0f172a" />
    <text x="14" y="20" class="node-text">3. Social Transformations / التحولات الاجتماعية</text>

    <g transform="translate(14, 46)">
      <circle cx="4" cy="5" r="3" fill="#38bdf8" />
      <text x="14" y="9" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">1. SNS Platforms:</tspan> Social networks, rapid distribution</text>

      <circle cx="4" cy="28" r="3" fill="#38bdf8" />
      <text x="14" y="32" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">2. E-Commerce (EC):</tspan> Online marketplace transactions</text>

      <circle cx="4" cy="51" r="3" fill="#38bdf8" />
      <text x="14" y="55" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">3. Remote Work:</tspan> Telecommuting via Cloud collaboration</text>

      <circle cx="4" cy="74" r="3" fill="#38bdf8" />
      <text x="14" y="78" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">4. Online Learning:</tspan> Interactive digital academic delivery</text>

      <circle cx="4" cy="97" r="3" fill="#38bdf8" />
      <text x="14" y="101" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">5. Cashless Payment:</tspan> QR codes, e-wallets, contactless</text>
    </g>
  </g>

  <!-- HUB 4: EMERGING TECH (Bottom-Right) -->
  <g transform="translate(720, 440)">
    <rect width="320" height="170" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="320" height="30" rx="8" fill="#0f172a" />
    <text x="14" y="20" class="node-text">4. Emerging Technologies / التقنيات الناشئة</text>

    <g transform="translate(14, 46)">
      <circle cx="4" cy="5" r="3" fill="#2dd4bf" />
      <text x="14" y="9" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">Autonomous Driving:</tspan> AI + sensor surroundings model</text>

      <circle cx="4" cy="28" r="3" fill="#2dd4bf" />
      <text x="14" y="32" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">Edge Computing:</tspan> Local vehicle processing (low-latency)</text>

      <circle cx="4" cy="51" r="3" fill="#2dd4bf" />
      <text x="14" y="55" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">Augmented Reality (AR):</tspan> Digital data overlaid on reality</text>

      <circle cx="4" cy="74" r="3" fill="#2dd4bf" />
      <text x="14" y="78" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">Virtual Reality (VR):</tspan> Fully immersive simulated space</text>

      <circle cx="4" cy="97" r="3" fill="#2dd4bf" />
      <text x="14" y="101" class="leaf-text"><tspan font-weight="600" fill="#f1f5f9">Quantum Computing:</tspan> Qubits in superposition (0 and 1)</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(250, 634)">
    <rect width="600" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="300" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      <tspan font-weight="600" fill="#93c5fd">Synthesis:</tspan> Breakthroughs in microelectronics catalyze societal digital infrastructure and modern AI platforms.
    </text>
  </g>
</svg>
