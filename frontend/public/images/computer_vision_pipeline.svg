<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .step-num { font-family: "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #f472b6; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 13px; fill: #f1f5f9; }
      .step-ar { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .pixel-box { font-family: "SF Mono", Consolas, monospace; font-size: 9px; fill: #64748b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="12" fill="url(#cvBg)" />
  <rect x="1.5" y="1.5" width="997" height="477" rx="11" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Header -->
  <text x="500" y="44" text-anchor="middle" class="title" font-size="20">Computer Vision (CV): Image Processing &amp; Object Detection</text>
  <text x="500" y="66" text-anchor="middle" class="subtitle">مسار الرؤية الحاسوبية: من مصفوفات البكسل إلى استخراج الميزات وتصنيف الأجسام</text>

  <!-- Pipeline Steps (4 Horizontal Blocks) -->

  <!-- STEP 1: PIXEL MATRIX INPUT -->
  <g transform="translate(60, 110)">
    <rect width="190" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="190" height="30" rx="8" fill="#0f172a" />
    <text x="14" y="20" class="step-num">STAGE 01</text>
    <text x="14" y="52" class="step-title">1. Pixel Grid Matrix</text>
    <text x="14" y="68" class="step-ar">مصفوفة البكسلات الرقمية</text>
    <line x1="14" y1="80" x2="176" y2="80" stroke="#334155" stroke-width="1" />

    <!-- 4x4 Pixel Grid preview -->
    <g transform="translate(45, 95)">
      <rect width="22" height="18" fill="#334155" stroke="#1e293b" /><rect x="24" width="22" height="18" fill="#475569" stroke="#1e293b" /><rect x="48" width="22" height="18" fill="#64748b" stroke="#1e293b" /><rect x="72" width="22" height="18" fill="#334155" stroke="#1e293b" />
      <rect y="20" width="22" height="18" fill="#475569" stroke="#1e293b" /><rect x="24" y="20" width="22" height="18" fill="#94a3b8" stroke="#1e293b" /><rect x="48" y="20" width="22" height="18" fill="#cbd5e1" stroke="#1e293b" /><rect x="72" y="20" width="22" height="18" fill="#475569" stroke="#1e293b" />
      <rect y="40" width="22" height="18" fill="#334155" stroke="#1e293b" /><rect x="24" y="40" width="22" height="18" fill="#cbd5e1" stroke="#1e293b" /><rect x="48" y="40" width="22" height="18" fill="#f1f5f9" stroke="#1e293b" /><rect x="72" y="40" width="22" height="18" fill="#334155" stroke="#1e293b" />
      <rect y="60" width="22" height="18" fill="#1e293b" stroke="#0f172a" /><rect x="24" y="60" width="22" height="18" fill="#475569" stroke="#1e293b" /><rect x="48" y="60" width="22" height="18" fill="#64748b" stroke="#1e293b" /><rect x="72" y="60" width="22" height="18" fill="#1e293b" stroke="#0f172a" />
    </g>

    <text x="14" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• 2D array of intensity (0-255)</text>
    <text x="14" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• RGB 3-channel depth</text>
    <text x="14" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Raw spatial resolution</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(260, 240)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#475569" stroke-width="1.8" />
    <polygon points="25,-4 32,0 25,4" fill="#475569" />
  </g>

  <!-- STEP 2: CONVOLUTIONAL FEATURE EXTRACTION -->
  <g transform="translate(300, 110)">
    <rect width="190" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="190" height="30" rx="8" fill="#0f172a" />
    <text x="14" y="20" class="step-num">STAGE 02</text>
    <text x="14" y="52" class="step-title">2. Feature Extraction</text>
    <text x="14" y="68" class="step-ar">مرشحات استخراج الحواف والزوايا</text>
    <line x1="14" y1="80" x2="176" y2="80" stroke="#334155" stroke-width="1" />

    <!-- Convolution Filter Kernels preview -->
    <g transform="translate(25, 100)">
      <rect width="60" height="60" rx="4" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
      <line x1="10" y1="10" x2="50" y2="50" stroke="#f472b6" stroke-width="2" />
      <text x="30" y="76" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">Edge Filter</text>

      <rect x="75" width="60" height="60" rx="4" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
      <circle cx="105" cy="30" r="16" fill="none" stroke="#f472b6" stroke-width="2" />
      <text x="105" y="76" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">Shape Filter</text>
    </g>

    <text x="14" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Convolutional kernels</text>
    <text x="14" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Edge and texture detection</text>
    <text x="14" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Spatial pooling layers</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(500, 240)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#475569" stroke-width="1.8" />
    <polygon points="25,-4 32,0 25,4" fill="#475569" />
  </g>

  <!-- STEP 3: DEEP REPRESENTATION -->
  <g transform="translate(535, 110)">
    <rect width="190" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="190" height="30" rx="8" fill="#0f172a" />
    <text x="14" y="20" class="step-num">STAGE 03</text>
    <text x="14" y="52" class="step-title">3. Hierarchical Layers</text>
    <text x="14" y="68" class="step-ar">طبقات التمثيل المعقد</text>
    <line x1="14" y1="80" x2="176" y2="80" stroke="#334155" stroke-width="1" />

    <!-- Feature stacking representation -->
    <g transform="translate(25, 95)">
      <rect width="135" height="20" rx="3" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="67" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c7d2fe">High: Objects &amp; Parts</text>

      <rect y="26" width="135" height="20" rx="3" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="67" y="40" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c7d2fe">Mid: Motifs &amp; Contours</text>

      <rect y="52" width="135" height="20" rx="3" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="67" y="66" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c7d2fe">Low: Pixels &amp; Edges</text>
    </g>

    <text x="14" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Hierarchical abstractions</text>
    <text x="14" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Invariance to scale &amp; angle</text>
    <text x="14" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Deep neural feature maps</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <g transform="translate(735, 240)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#475569" stroke-width="1.8" />
    <polygon points="25,-4 32,0 25,4" fill="#475569" />
  </g>

  <!-- STEP 4: OUTPUT PREDICTION -->
  <g transform="translate(770, 110)">
    <rect width="170" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="170" height="30" rx="8" fill="#0f172a" />
    <text x="14" y="20" class="step-num">STAGE 04</text>
    <text x="14" y="52" class="step-title">4. Recognition &amp; BBox</text>
    <text x="14" y="68" class="step-ar">التعرف وتحديد الموقع</text>
    <line x1="14" y1="80" x2="156" y2="80" stroke="#334155" stroke-width="1" />

    <!-- Output preview -->
    <rect x="14" y="95" width="142" height="65" rx="4" fill="#0f172a" stroke="#059669" stroke-width="1" />
    <text x="24" y="118" font-family="monospace" font-size="10.5" fill="#34d399">Vehicle: 98.4%</text>
    <text x="24" y="136" font-family="monospace" font-size="10" fill="#94a3b8">BBox: [x, y, w, h]</text>
    <text x="24" y="150" font-family="sans-serif" font-size="9" fill="#64748b">تحديد الموضع والنوع</text>

    <text x="14" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Object classification</text>
    <text x="14" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Bounding-box localization</text>
    <text x="14" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Medical pathology scan</text>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(150, 422)">
    <rect width="700" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="350" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      <tspan font-weight="600" fill="#93c5fd">Mathematical Mechanism:</tspan> Computer vision transforms spatial pixel intensities into invariant geometric feature maps for classification and localization.
    </text>
  </g>
</svg>
