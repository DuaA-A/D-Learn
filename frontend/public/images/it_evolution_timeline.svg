<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="25%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .year { font-family: monospace; font-size: 12px; font-weight: bold; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-weight: bold; font-size: 14px; fill: #f8fafc; }
      .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .card-ar { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #38bdf8; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="20" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="996" height="476" rx="18" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Header -->
  <text x="500" y="45" text-anchor="middle" class="title" font-size="22">🚀 Stages of Information Technology Evolution</text>
  <text x="500" y="68" text-anchor="middle" class="subtitle">مراحل تطور تكنولوجيا المعلومات وأثرها التاريخي على المجتمع</text>

  <!-- Connecting Timeline Line -->
  <path d="M 100 240 L 900 240" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glow)" />
  <path d="M 100 240 L 900 240" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Stage 1: 1940s-60s -->
  <g transform="translate(100, 240)">
    <!-- Node -->
    <circle r="14" fill="#1e293b" stroke="#3b82f6" stroke-width="4" filter="url(#glow)" />
    <circle r="6" fill="#60a5fa" />
    <text y="-25" text-anchor="middle" class="year" fill="#60a5fa">1940s–60s</text>
    <!-- Card Upper -->
    <g transform="translate(-80, -170)">
      <rect width="160" height="125" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.5" />
      <text x="80" y="24" text-anchor="middle" class="card-title">1. Mainframes</text>
      <text x="80" y="42" text-anchor="middle" class="card-ar">الحواسيب الأولى (ENIAC)</text>
      <line x1="20" y1="52" x2="140" y2="52" stroke="#334155" stroke-width="1" />
      <text x="15" y="70" class="card-sub">• Vacuum tubes / صمامات</text>
      <text x="15" y="88" class="card-sub">• Military &amp; Scientific use</text>
      <text x="15" y="106" class="card-sub">• حسابات علمية وعسكرية</text>
    </g>
  </g>

  <!-- Stage 2: 1970s-80s -->
  <g transform="translate(300, 240)">
    <!-- Node -->
    <circle r="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="4" filter="url(#glow)" />
    <circle r="6" fill="#a78bfa" />
    <text y="32" text-anchor="middle" class="year" fill="#a78bfa">1970s–80s</text>
    <!-- Card Lower -->
    <g transform="translate(-80, 48)">
      <rect width="160" height="125" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="80" y="24" text-anchor="middle" class="card-title">2. Personal PC</text>
      <text x="80" y="42" text-anchor="middle" class="card-ar">انتشار الحواسيب الشخصية</text>
      <line x1="20" y1="52" x2="140" y2="52" stroke="#334155" stroke-width="1" />
      <text x="15" y="70" class="card-sub">• Microprocessors (CPU)</text>
      <text x="15" y="88" class="card-sub">• Home &amp; Office adoption</text>
      <text x="15" y="106" class="card-sub">• بداية الحوسبة الفردية</text>
    </g>
  </g>

  <!-- Stage 3: 1990s -->
  <g transform="translate(500, 240)">
    <!-- Node -->
    <circle r="14" fill="#1e293b" stroke="#ec4899" stroke-width="4" filter="url(#glow)" />
    <circle r="6" fill="#f472b6" />
    <text y="-25" text-anchor="middle" class="year" fill="#f472b6">1990s</text>
    <!-- Card Upper -->
    <g transform="translate(-80, -170)">
      <rect width="160" height="125" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.5" />
      <text x="80" y="24" text-anchor="middle" class="card-title">3. The Web &amp; Net</text>
      <text x="80" y="42" text-anchor="middle" class="card-ar">الإنترنت التجاري والويب</text>
      <line x1="20" y1="52" x2="140" y2="52" stroke="#334155" stroke-width="1" />
      <text x="15" y="70" class="card-sub">• World Wide Web (WWW)</text>
      <text x="15" y="88" class="card-sub">• Globalization &amp; Email</text>
      <text x="15" y="106" class="card-sub">• عولمة البيانات والتواصل</text>
    </g>
  </g>

  <!-- Stage 4: 2000s -->
  <g transform="translate(700, 240)">
    <!-- Node -->
    <circle r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="4" filter="url(#glow)" />
    <circle r="6" fill="#fbbf24" />
    <text y="32" text-anchor="middle" class="year" fill="#fbbf24">2000s</text>
    <!-- Card Lower -->
    <g transform="translate(-80, 48)">
      <rect width="160" height="125" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" />
      <text x="80" y="24" text-anchor="middle" class="card-title">4. Smartphones</text>
      <text x="80" y="42" text-anchor="middle" class="card-ar">الهواتف الذكية وتطبيقاتها</text>
      <line x1="20" y1="52" x2="140" y2="52" stroke="#334155" stroke-width="1" />
      <text x="15" y="70" class="card-sub">• iPhone &amp; Android era</text>
      <text x="15" y="88" class="card-sub">• Mobile internet anytime</text>
      <text x="15" y="106" class="card-sub">• انطلاق شبكات التواصل</text>
    </g>
  </g>

  <!-- Stage 5: 2010s Onward -->
  <g transform="translate(900, 240)">
    <!-- Node -->
    <circle r="14" fill="#1e293b" stroke="#10b981" stroke-width="4" filter="url(#glow)" />
    <circle r="6" fill="#34d399" />
    <text y="-25" text-anchor="middle" class="year" fill="#34d399">2010s+</text>
    <!-- Card Upper -->
    <g transform="translate(-80, -170)">
      <rect width="160" height="125" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
      <text x="80" y="24" text-anchor="middle" class="card-title">5. Cloud &amp; AI</text>
      <text x="80" y="42" text-anchor="middle" class="card-ar">الحوسبة السحابية والذكاء</text>
      <line x1="20" y1="52" x2="140" y2="52" stroke="#334155" stroke-width="1" />
      <text x="15" y="70" class="card-sub">• Big Data &amp; Neural Nets</text>
      <text x="15" y="88" class="card-sub">• IT Delivered as a Service</text>
      <text x="15" y="106" class="card-sub">• النماذج الذكية التوليدية</text>
    </g>
  </g>

  <!-- Bottom Key Insight Banner -->
  <g transform="translate(200, 420)">
    <rect width="600" height="36" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="300" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c7d2fe">
      💡 <tspan font-weight="bold">Key Takeaway:</tspan> Each wave transformed not only hardware, but how humans work, pay, learn, and live.
    </text>
  </g>
</svg>
