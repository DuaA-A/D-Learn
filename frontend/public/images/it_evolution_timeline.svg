<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="25%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .year { font-family: "SF Mono", Consolas, monospace; font-size: 12px; font-weight: 600; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13.5px; fill: #f1f5f9; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .card-ar { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #38bdf8; font-weight: 500; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="12" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="997" height="477" rx="11" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Header -->
  <text x="500" y="44" text-anchor="middle" class="title" font-size="20">Stages of Information Technology Evolution</text>
  <text x="500" y="66" text-anchor="middle" class="subtitle">المراحل الخمس لتطور تكنولوجيا المعلومات وأثرها التاريخي على المجتمع</text>

  <!-- Connecting Timeline Line -->
  <path d="M 100 240 L 900 240" stroke="url(#lineGrad)" stroke-width="3" />

  <!-- Stage 1: 1940s-60s -->
  <g transform="translate(100, 240)">
    <circle r="12" fill="#0f172a" stroke="#2563eb" stroke-width="3" />
    <circle r="4" fill="#60a5fa" />
    <text y="-22" text-anchor="middle" class="year" fill="#93c5fd">1940s–60s</text>
    <g transform="translate(-80, -165)">
      <rect width="160" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="24" text-anchor="middle" class="card-title">1. Mainframes</text>
      <text x="80" y="40" text-anchor="middle" class="card-ar">الحواسيب الأولى (ENIAC)</text>
      <line x1="16" y1="50" x2="144" y2="50" stroke="#334155" stroke-width="1" />
      <text x="14" y="68" class="card-sub">• Vacuum tubes / صمامات</text>
      <text x="14" y="86" class="card-sub">• Military calculation</text>
      <text x="14" y="104" class="card-sub">• حسابات علمية وعسكرية</text>
    </g>
  </g>

  <!-- Stage 2: 1970s-80s -->
  <g transform="translate(300, 240)">
    <circle r="12" fill="#0f172a" stroke="#6366f1" stroke-width="3" />
    <circle r="4" fill="#818cf8" />
    <text y="28" text-anchor="middle" class="year" fill="#a5b4fc">1970s–80s</text>
    <g transform="translate(-80, 45)">
      <rect width="160" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="24" text-anchor="middle" class="card-title">2. Personal PC</text>
      <text x="80" y="40" text-anchor="middle" class="card-ar">انتشار الحاسوب الشخصي</text>
      <line x1="16" y1="50" x2="144" y2="50" stroke="#334155" stroke-width="1" />
      <text x="14" y="68" class="card-sub">• Microprocessor chips</text>
      <text x="14" y="86" class="card-sub">• Workplace adoption</text>
      <text x="14" y="104" class="card-sub">• بداية الحوسبة الفردية</text>
    </g>
  </g>

  <!-- Stage 3: 1990s -->
  <g transform="translate(500, 240)">
    <circle r="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="3" />
    <circle r="4" fill="#a78bfa" />
    <text y="-22" text-anchor="middle" class="year" fill="#c4b5fd">1990s</text>
    <g transform="translate(-80, -165)">
      <rect width="160" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="24" text-anchor="middle" class="card-title">3. The Web &amp; Net</text>
      <text x="80" y="40" text-anchor="middle" class="card-ar">الإنترنت التجاري والويب</text>
      <line x1="16" y1="50" x2="144" y2="50" stroke="#334155" stroke-width="1" />
      <text x="14" y="68" class="card-sub">• World Wide Web (WWW)</text>
      <text x="14" y="86" class="card-sub">• Global communication</text>
      <text x="14" y="104" class="card-sub">• عولمة تبادل المعلومات</text>
    </g>
  </g>

  <!-- Stage 4: 2000s -->
  <g transform="translate(700, 240)">
    <circle r="12" fill="#0f172a" stroke="#0284c7" stroke-width="3" />
    <circle r="4" fill="#38bdf8" />
    <text y="28" text-anchor="middle" class="year" fill="#7dd3fc">2000s</text>
    <g transform="translate(-80, 45)">
      <rect width="160" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="24" text-anchor="middle" class="card-title">4. Smartphones</text>
      <text x="80" y="40" text-anchor="middle" class="card-ar">الهواتف الذكية وتطبيقاتها</text>
      <line x1="16" y1="50" x2="144" y2="50" stroke="#334155" stroke-width="1" />
      <text x="14" y="68" class="card-sub">• Mobile OS platforms</text>
      <text x="14" y="86" class="card-sub">• Continuous connectivity</text>
      <text x="14" y="104" class="card-sub">• ثورة التطبيقات المحمولة</text>
    </g>
  </g>

  <!-- Stage 5: 2010s Onward -->
  <g transform="translate(900, 240)">
    <circle r="12" fill="#0f172a" stroke="#0d9488" stroke-width="3" />
    <circle r="4" fill="#2dd4bf" />
    <text y="-22" text-anchor="middle" class="year" fill="#5eead4">2010s+</text>
    <g transform="translate(-80, -165)">
      <rect width="160" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="24" text-anchor="middle" class="card-title">5. Cloud &amp; AI</text>
      <text x="80" y="40" text-anchor="middle" class="card-ar">الحوسبة السحابية والذكاء</text>
      <line x1="16" y1="50" x2="144" y2="50" stroke="#334155" stroke-width="1" />
      <text x="14" y="68" class="card-sub">• Infrastructure as a Service</text>
      <text x="14" y="86" class="card-sub">• Large-scale deep models</text>
      <text x="14" y="104" class="card-sub">• تحليل البيانات الضخمة</text>
    </g>
  </g>

  <!-- Bottom Insight Footer -->
  <g transform="translate(200, 422)">
    <rect width="600" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="300" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#cbd5e1">
      <tspan font-weight="600" fill="#93c5fd">Key Insight:</tspan> Each technological phase redefined communication, commerce, education, and labor patterns.
    </text>
  </g>
</svg>
